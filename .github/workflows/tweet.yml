name: Tweet from articles

on:
  schedule:
    - cron: '18 */6 * * *'  # every 6h at :18 UTC (off top-of-hour congestion): 00:18 / 06:18 / 12:18 / 18:18
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Draft + log but do not post'
        type: boolean
        default: false

permissions:
  contents: write           # to commit history.jsonl back

concurrency:
  group: tweet              # never run two posters at once
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install CLIs (claude, xurl, jq)
        run: |
          npm install -g @anthropic-ai/claude-code
          go install github.com/xdevplatform/xurl@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get -qq update && sudo apt-get -qq install -y jq

      - name: Restore xurl config
        env:
          XURL_CONFIG: ${{ secrets.XURL_CONFIG }}
        run: |
          printf '%s' "$XURL_CONFIG" > "$HOME/.xurl"
          chmod 600 "$HOME/.xurl"

      - name: Draft + post
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: bash .github/scripts/tweet.sh

      - name: Commit history back
        if: always()
        run: |
          git config user.name  "tweet-bot"
          git config user.email "tweet-bot@users.noreply.github.com"
          git add tweet-state/history.jsonl
          git diff --cached --quiet && { echo "no history change"; exit 0; }
          git commit -m "tweet-bot: update history ($(date -u +%FT%TZ))"
          git pull --rebase --autostash origin main
          git push
