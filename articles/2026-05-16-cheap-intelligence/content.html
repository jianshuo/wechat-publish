<p style="margin: 1em 0; line-height: 1.75; font-size: 17px; color: #333;">我最近总是陷入深深的沉思，却沉思不出来任何结果。</p>
<p style="margin: 1em 0; line-height: 1.75; font-size: 17px; color: #333;">因为脑子里其实没有一个明确的问题。如果说有一个大致的方向，那就是：在一个智能忽然变得极为廉价、且完全可以扩展的时候，未来最大的机会在哪里？</p>
<p style="margin: 1em 0; line-height: 1.75; font-size: 17px; color: #333;">这个问题一直在脑子里转圈，却不知道怎么回答。</p>
<p style="margin: 1em 0; line-height: 1.75; font-size: 17px; color: #333;">Gmail 推出 2G 邮件的时候，是基于存储将会变得无比便宜。YouTube 出现的时候，是基于带宽变得廉价。很多东西忽然变得廉价以后，会彻底改变社会结构，重写整个商业世界。</p>
