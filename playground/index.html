<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X Tweet Rewrite Playground</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>X Tweet Rewrite Playground</h1>
        <span id="status">Loading tweets...</span>
      </div>
      <form id="prompt-form" class="prompt-form">
        <textarea id="prompt" rows="2" placeholder="Rewrite prompt" required></textarea>
        <button id="run-button" type="submit">Run</button>
      </form>
    </header>

    <main class="workspace">
      <section class="original-panel" aria-label="Original tweets">
        <div class="column-header">
          <strong>Original</strong>
          <span id="tweet-count">0 tweets</span>
        </div>
        <div id="original-list" class="tweet-list"></div>
      </section>

      <section class="versions-panel" aria-label="Rewrite versions">
        <div id="versions" class="versions"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
